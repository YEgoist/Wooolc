<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>计时器</title>
<style>
  :root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#111827;
    --muted:#9aa3b2;
    --border:#e6e9f0;
    --accent:#3b82f6;
    --accent-soft:#eaf1ff;
    --danger:#ef4444;
    --warn:#f59e0b;
    --radius:16px;
    --shadow:0 1px 2px rgba(17,24,39,.05), 0 6px 20px rgba(17,24,39,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117;
      --card:#161b22;
      --text:#e6edf3;
      --muted:#6e7781;
      --border:#232a35;
      --accent:#4f8cff;
      --accent-soft:#1b2637;
      --danger:#ff6b6b;
      --warn:#ffb020;
      --shadow:none;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;overflow-x:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .2s, color .2s;
  }

  .app{
    max-width:1200px;
    margin:0 auto;
    padding:24px 20px 80px;
  }

  /* ---------- 顶部工具栏 ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  .toolbar-left{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .size-panel{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 12px;
    box-shadow:var(--shadow);
    transition:opacity .15s;
  }
  .size-panel.hidden{display:none}

  .size-field{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    color:var(--muted);
    user-select:none;
  }
  .size-field input{
    width:66px;height:32px;
    border:1px solid var(--border);
    border-radius:10px;
    background:transparent;
    color:var(--text);
    text-align:center;
    font-size:13px;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    padding:0 4px;
    -moz-appearance:textfield;
    transition:border-color .15s, background .15s;
  }
  .size-field input::-webkit-outer-spin-button,
  .size-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .size-field input:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}
  .size-field input::placeholder{color:var(--muted);opacity:.65;font-size:12px}

  .size-divider{
    width:1px;height:18px;
    background:var(--border);
    align-self:center;
  }

  .def-input{
    width:32px !important;
    height:28px !important;
    border-radius:8px !important;
    font-size:12px !important;
    padding:0 !important;
  }

  .switch-field{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  .switch-input{
    appearance:none;
    -webkit-appearance:none;
    width:36px;height:20px;
    border-radius:10px;
    background:var(--border);
    position:relative;
    cursor:pointer;
    margin:0;
    padding:0;
    border:none;
    flex:none;
    transition:background .2s;
  }
  .switch-input::after{
    content:'';
    position:absolute;
    top:2px;left:2px;
    width:16px;height:16px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
    transition:transform .2s;
  }
  .switch-input:checked{background:var(--accent)}
  .switch-input:checked::after{transform:translateX(16px)}

  .add-btn{
    display:inline-flex;align-items:center;gap:6px;
    height:40px;padding:0 18px;border-radius:20px;
    border:none;background:var(--accent);color:#fff;
    font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(59,130,246,.28);
    transition:transform .08s, background .2s, box-shadow .2s;
  }
  .add-btn:hover{background:#2f6fe0}
  .add-btn:active{transform:scale(.96)}
  .add-btn svg{width:18px;height:18px;fill:currentColor}

  .size-toggle{
    width:40px;height:40px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    display:grid;place-items:center;
    padding:0;cursor:pointer;
    transition:background .15s, border-color .15s, color .15s, transform .06s;
  }
  .size-toggle:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .size-toggle:active{transform:scale(.93)}
  .size-toggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .size-toggle svg{width:18px;height:18px;fill:currentColor}

  /* ---------- 浮动容器 ---------- */
  .float-wrap{
    position: relative;
  }
  .float-wrap.floating{
    position: fixed;
    z-index: 500;
  }

  .drag-bar{
    display: none;
    height: 24px;
    align-items: center;
    justify-content: center;
    cursor: grab;
    color: var(--muted);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    border-radius: 10px;
    transition: color .15s, background .15s;
  }
  .float-wrap.floating .drag-bar{ display: flex; }
  .drag-bar:hover{ color: var(--accent); background: var(--accent-soft); }
  .drag-bar:active{ cursor: grabbing; }
  .drag-bar svg{ width:22px; height:22px; fill: currentColor; opacity: .7; }
  .drag-bar:hover svg{ opacity: 1; }

  #grid.snap-hint{
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
    border-radius: 6px;
  }

  /* ---------- 网格 ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(300px, 100%), 1fr));
    gap:16px;
    align-items:start;
    margin:0 auto;
    overflow:auto;
    scrollbar-gutter:stable;
    scrollbar-width:thin;
    scrollbar-color:var(--border) transparent;
  }
  .grid::-webkit-scrollbar{width:8px;height:8px}
  .grid::-webkit-scrollbar-track{background:transparent}
  .grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .grid::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px 14px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:4px;
    transition:background .2s, border-color .2s;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .card input{
    user-select:text;
    -webkit-user-select:text;
  }

  .card-head{display:flex;align-items:center;gap:6px}

  .name{
    flex:1;min-width:0;
    border:none;background:transparent;
    color:var(--text);
    font-size:14px;font-weight:600;font-family:inherit;
    padding:5px 6px;
    border-radius:8px;
    text-overflow:ellipsis;
  }
  .name::placeholder{color:var(--muted);font-weight:400}
  .name:focus{outline:none;background:var(--accent-soft)}

  /* ---------- 时间显示 ---------- */
  .display{
    font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size:2.25rem;
    font-weight:600;
    line-height:1.15;
    letter-spacing:.5px;
    text-align:center;
    padding:8px 0 12px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    color:var(--text);
    transition:color .2s;
  }
  .display.warn{color:var(--warn)}
  .display.neg{color:var(--danger)}

  /* ---------- 底部：设置 + 操作 ---------- */
  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }

  .setters{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
    min-height:32px;
    border-radius:10px;
    transition:background .15s;
  }
  .card.running .setters:hover{background:var(--accent-soft)}

  .field{
    display:flex;
    align-items:center;
    gap:2px;
    transition:opacity .15s ease;
  }
  .card.running .setters .field{opacity:0;visibility:hidden}
  .card.running .setters:hover .field{opacity:1;visibility:visible}

  .field input{
    width:36px;height:32px;
    border:1px solid var(--border);
    border-radius:8px;
    background:transparent;
    color:var(--text);
    text-align:center;
    font-size:14px;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    padding:0;
    -moz-appearance:textfield;
    transition:border-color .15s, background .15s;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .field input:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}

  .unit{font-size:11px;color:var(--muted);user-select:none}

  .actions{display:flex;gap:6px}

  .icon-btn{
    width:34px;height:34px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    display:grid;place-items:center;
    padding:0;cursor:pointer;
    transition:background .15s, border-color .15s, color .15s, transform .06s;
  }
  .icon-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .icon-btn:active{transform:scale(.93)}
  .icon-btn svg{width:16px;height:16px;fill:currentColor}

  .btn-del{width:28px;height:28px;border-color:transparent;color:var(--muted)}
  .btn-del:hover{color:var(--danger);border-color:var(--danger);background:transparent}

  .btn-fold{
    display:none;
    width:28px;height:28px;
    border-color:transparent;
    color:var(--muted);
  }
  .btn-fold:hover{color:var(--accent);border-color:var(--accent);background:transparent}
  .btn-fold .i-fold-up{display:none}
  .card.expanded .btn-fold .i-fold-down{display:none}
  .card.expanded .btn-fold .i-fold-up{display:block}

  .btn-play .i-pause{display:none}
  .btn-play.running .i-play{display:none}
  .btn-play.running .i-pause{display:block}
  .btn-play.running{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  /* ==================== 紧凑模式 ==================== */
  .grid.compact .btn-fold{display:grid}

  .grid.compact .card{
    display:grid;
    grid-template-columns:1fr auto auto;
    grid-template-areas:
      "head    head    head"
      "display play    reset";
    gap:6px 8px;
    align-items:center;
    padding:10px 12px;
  }
  .grid.compact .card.expanded{
    grid-template-areas:
      "head    head    head"
      "display play    reset"
      "setters setters setters";
  }
  .grid.compact .card .card-head{grid-area:head}
  .grid.compact .card .display{
    grid-area:display;
    text-align:center;
    padding:0 4px;
    font-size:1.75rem;
    line-height:1.2;
  }
  .grid.compact .card .card-foot{display:contents}
  .grid.compact .card .actions{display:contents}
  .grid.compact .card .btn-play{grid-area:play}
  .grid.compact .card .btn-reset{grid-area:reset}
  .grid.compact .card .setters{
    grid-area:setters;
    display:none;
    min-height:32px;
    padding-top:2px;
  }
  .grid.compact .card.expanded .setters{display:flex}

  .grid.compact .card.running .setters .field{opacity:1;visibility:visible}
  .grid.compact .card.running .setters:hover{background:transparent}

  @media (hover:none){
    .card.running .setters .field{opacity:1;visibility:visible}
    .card.running .setters:hover{background:transparent}
  }

  /* ==================== 卡片拖拽排序 ==================== */
  .card.dragging{
    pointer-events:none;
    opacity:.95;
    box-shadow:0 12px 40px rgba(0,0,0,.18);
    transition:none !important;
    cursor:grabbing;
    will-change:left, top;
  }
  .drag-placeholder{
    border:2px dashed var(--accent);
    border-radius:var(--radius);
    background:var(--accent-soft);
    opacity:.5;
    pointer-events:none;
    box-sizing:border-box;
    transition:opacity .12s;
  }
  body.dragging-active{
    cursor:grabbing;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---------- 空状态 ---------- */
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:70px 0;
    user-select:none;
  }

  /* ---------- 小屏适配 ---------- */
  @media (max-width:560px){
    .toolbar{justify-content:center}
    .toolbar-left{justify-content:center;width:100%}
    .add-btn{width:100%;justify-content:center}
  }
  @media (max-width:480px){
    .app{padding:16px 12px 60px}
    .toolbar{margin-bottom:14px}
    .display{font-size:1.95rem;padding:6px 0 10px}
    .grid.compact .card .display{font-size:1.5rem}
  }
</style>
</head>
<body>

<div class="app">
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="sizeToggle" class="size-toggle" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>

      <div id="sizePanel" class="size-panel hidden">
        <label class="size-field">
          <span>宽</span>
          <input id="maxW" type="number" inputmode="numeric" min="0" max="4000" placeholder="不限" aria-label="容器最大宽度">
          <span>px</span>
        </label>
        <label class="size-field">
          <span>高</span>
          <input id="maxH" type="number" inputmode="numeric" min="0" max="4000" placeholder="不限" aria-label="容器最大高度">
          <span>px</span>
        </label>
        <label class="switch-field">
          <span>紧凑</span>
          <input id="compactToggle" class="switch-input" type="checkbox">
        </label>
        <span class="size-divider"></span>
        <span class="size-field" title="新计时器默认时长">
          <span>默认</span>
          <input id="defH" class="def-input" type="number" inputmode="numeric" min="0" max="999" placeholder="0" aria-label="默认小时">
          <span>时</span>
          <input id="defM" class="def-input" type="number" inputmode="numeric" min="0" max="999" placeholder="0" aria-label="默认分钟">
          <span>分</span>
          <input id="defS" class="def-input" type="number" inputmode="numeric" min="0" max="999" placeholder="0" aria-label="默认秒">
          <span>秒</span>
        </span>
      </div>
    </div>

    <button id="addBtn" class="add-btn" title="添加计时器">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      <span>添加</span>
    </button>
  </div>

  <div id="floatWrap" class="float-wrap">
    <div id="dragBar" class="drag-bar" title="拖动容器">
      <svg viewBox="0 0 24 24"><path d="M4 7h16v2H4zm0 4h16v2H4zm0 4h16v2H4z"/></svg>
    </div>
    <main id="grid" class="grid"></main>
    <div id="empty" class="empty">点「添加」创建计时器</div>
  </div>
</div>

<!-- 计时器卡片模板 -->
<template id="tpl">
  <section class="card">
    <div class="card-head">
      <input class="name" type="text" maxlength="30" placeholder="名称" aria-label="计时器名称">
      <button class="icon-btn btn-fold" title="展开时间设置" aria-label="展开或收起时间设置">
        <svg class="i-fold-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        <svg class="i-fold-up" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>
      </button>
      <button class="icon-btn btn-del" title="删除" aria-label="删除">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <div class="display">00:00:00</div>

    <div class="card-foot">
      <div class="setters">
        <span class="field">
          <input class="in-h" type="number" inputmode="numeric" min="0" max="999" placeholder="00" aria-label="小时">
          <span class="unit">时</span>
        </span>
        <span class="field">
          <input class="in-m" type="number" inputmode="numeric" min="0" max="999" placeholder="00" aria-label="分钟">
          <span class="unit">分</span>
        </span>
        <span class="field">
          <input class="in-s" type="number" inputmode="numeric" min="0" max="999" placeholder="00" aria-label="秒">
          <span class="unit">秒</span>
        </span>
      </div>

      <div class="actions">
        <button class="icon-btn btn-play" title="开始" aria-label="开始或暂停">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="icon-btn btn-reset" title="重置" aria-label="重置">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </div>
  </section>
</template>

<script>
(function () {
  'use strict';

  var grid         = document.getElementById('grid');
  var emptyEl      = document.getElementById('empty');
  var tpl          = document.getElementById('tpl');
  var addBtn       = document.getElementById('addBtn');
  var maxWIn       = document.getElementById('maxW');
  var maxHIn       = document.getElementById('maxH');
  var sizeToggle   = document.getElementById('sizeToggle');
  var sizePanel    = document.getElementById('sizePanel');
  var compactInput = document.getElementById('compactToggle');
  var defH         = document.getElementById('defH');
  var defM         = document.getElementById('defM');
  var defS         = document.getElementById('defS');
  var floatWrap    = document.getElementById('floatWrap');
  var dragBar      = document.getElementById('dragBar');

  var timers = [];
  var rafId  = null;
  var seq    = 0;   // 仅作内部 id，不再用于命名

  var defaultSec = 300;
  var STORE_KEY   = 'countdown-state-v3';
  var SIZE_KEY    = 'countdown-container-size';
  var COMPACT_KEY = 'countdown-compact';
  var FLOAT_KEY   = 'countdown-float-pos';

  var DRAG_BAR_H = 24;
  var SNAP_DIST  = 22;

  /* ============ 通用工具 ============ */

  function clampInt(v, min, max) {
    var n = parseInt(v, 10);
    if (isNaN(n)) n = 0;
    return Math.max(min, Math.min(max, n));
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fmt(ms) {
    var neg = ms < 0;
    var total = Math.ceil(Math.abs(ms) / 1000);
    return (neg ? '-' : '') +
      pad(Math.floor(total / 3600)) + ':' +
      pad(Math.floor((total % 3600) / 60)) + ':' +
      pad(total % 60);
  }

  function debounce(fn, wait) {
    var id = null;
    return function () {
      clearTimeout(id);
      id = setTimeout(fn, wait);
    };
  }

  function paint(t, ms) {
    var el = t.el;
    var text = fmt(ms);
    if (text !== t.lastText) {
      el.display.textContent = text;
      t.lastText = text;
    }
    var state = ms < 0 ? 'neg' : (ms > 0 && ms <= 10000 ? 'warn' : '');
    if (state !== t.lastState) {
      el.display.classList.toggle('neg', state === 'neg');
      el.display.classList.toggle('warn', state === 'warn');
      t.lastState = state;
    }
  }

  function updateEmpty() {
    emptyEl.style.display = timers.length ? 'none' : '';
  }

  /* ============ 新计时器命名：基于当前已有名字，取最小空缺编号 ============ */

  function computeNextTimerName() {
    var used = {};
    for (var i = 0; i < timers.length; i++) {
      var n = (timers[i].el.name.value || '').trim();
      if (n) used[n] = true;
    }
    var num = 1;
    while (used['计时器 ' + num]) num++;
    return '计时器 ' + num;
  }

  /* ============ 设置面板显隐 ============ */

  function toggleSizePanel() {
    var hidden = sizePanel.classList.toggle('hidden');
    sizeToggle.classList.toggle('active', !hidden);
  }
  sizeToggle.addEventListener('click', toggleSizePanel);

  /* ============ 浮动容器（可拖放 + 边缘吸附） ============ */

  var isFloating = false;

  function computeWrapWidth() {
    var maxW = parseFloat(maxWIn.value) || 0;
    var avail = window.innerWidth - 24;
    if (avail < 200) avail = window.innerWidth;
    var base = maxW > 0 ? maxW : 1200;
    return Math.min(base, avail);
  }

  function loadFloatPos() {
    try { return JSON.parse(localStorage.getItem(FLOAT_KEY) || 'null'); }
    catch (e) { return null; }
  }

  function saveFloatPos() {
    if (!isFloating) return;
    var r = floatWrap.getBoundingClientRect();
    try {
      localStorage.setItem(FLOAT_KEY, JSON.stringify({
        left: Math.round(r.left),
        top: Math.round(r.top)
      }));
    } catch (e) { /* 忽略 */ }
  }

  function enableFloating() {
    var rect = grid.getBoundingClientRect();
    var saved = loadFloatPos();

    isFloating = true;
    floatWrap.classList.add('floating');
    floatWrap.style.width = computeWrapWidth() + 'px';

    var left = saved ? saved.left : rect.left;
    var top  = saved ? saved.top  : (rect.top - DRAG_BAR_H);
    if (!isFinite(left)) left = 0;
    if (!isFinite(top)) top = 0;

    floatWrap.style.left = Math.max(0, left) + 'px';
    floatWrap.style.top  = Math.max(0, top) + 'px';

    requestAnimationFrame(clampPosition);
  }

  function disableFloating() {
    isFloating = false;
    floatWrap.classList.remove('floating');
    floatWrap.style.left = '';
    floatWrap.style.top = '';
    floatWrap.style.width = '';
    grid.classList.remove('snap-hint');
    try { localStorage.removeItem(FLOAT_KEY); } catch (e) { /* 忽略 */ }
  }

  function clampPosition() {
    if (!isFloating) return;
    var r = floatWrap.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = Math.max(0, Math.min(r.left, vw - r.width));
    var top  = Math.max(0, Math.min(r.top,  vh - r.height));
    floatWrap.style.left = left + 'px';
    floatWrap.style.top  = top + 'px';
  }

  var barDrag = {
    active: false,
    pointerId: null,
    startX: 0, startY: 0,
    baseLeft: 0, baseTop: 0
  };

  function onBarDown(e) {
    if (!isFloating) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();

    var r = floatWrap.getBoundingClientRect();
    barDrag.active = true;
    barDrag.pointerId = e.pointerId;
    barDrag.startX = e.clientX;
    barDrag.startY = e.clientY;
    barDrag.baseLeft = r.left;
    barDrag.baseTop = r.top;

    try { dragBar.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    document.body.classList.add('dragging-active');
  }

  function onBarMove(e) {
    if (!barDrag.active || e.pointerId !== barDrag.pointerId) return;
    if (e.cancelable) e.preventDefault();

    var dx = e.clientX - barDrag.startX;
    var dy = e.clientY - barDrag.startY;
    applyFloatMove(barDrag.baseLeft + dx, barDrag.baseTop + dy);
  }

  function onBarUp(e) {
    if (!barDrag.active || e.pointerId !== barDrag.pointerId) return;
    barDrag.active = false;
    barDrag.pointerId = null;
    document.body.classList.remove('dragging-active');
    grid.classList.remove('snap-hint');
    try { dragBar.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    saveFloatPos();
  }

  function applyFloatMove(left, top) {
    var r = floatWrap.getBoundingClientRect();
    var w = r.width, h = r.height;
    var vw = window.innerWidth, vh = window.innerHeight;

    var snapH = 0, snapV = 0;

    if (left <= SNAP_DIST) { left = 0; snapH = -1; }
    else if (left + w >= vw - SNAP_DIST) { left = vw - w; snapH = 1; }

    if (top <= SNAP_DIST) { top = 0; snapV = -1; }
    else if (top + h >= vh - SNAP_DIST) { top = vh - h; snapV = 1; }

    left = Math.max(0, Math.min(left, Math.max(0, vw - w)));
    top  = Math.max(0, Math.min(top,  Math.max(0, vh - h)));

    floatWrap.style.left = left + 'px';
    floatWrap.style.top  = top + 'px';

    grid.classList.toggle('snap-hint', snapH !== 0 || snapV !== 0);
  }

  dragBar.addEventListener('pointerdown', onBarDown);
  dragBar.addEventListener('pointermove', onBarMove);
  dragBar.addEventListener('pointerup', onBarUp);
  dragBar.addEventListener('pointercancel', onBarUp);

  /* ============ 容器尺寸 ============ */

  function applyMaxSize() {
    var w = parseFloat(maxWIn.value) || 0;
    var h = parseFloat(maxHIn.value) || 0;

    grid.style.maxWidth  = (w > 0) ? w + 'px' : '';
    grid.style.maxHeight = (h > 0) ? h + 'px' : '';

    try {
      localStorage.setItem(SIZE_KEY, JSON.stringify({
        w: w > 0 ? w : '',
        h: h > 0 ? h : ''
      }));
    } catch (e) { /* 忽略 */ }

    if (w > 0 || h > 0) {
      if (!isFloating) {
        enableFloating();
      } else {
        floatWrap.style.width = computeWrapWidth() + 'px';
        clampPosition();
      }
    } else {
      if (isFloating) disableFloating();
    }
  }

  function restoreMaxSize() {
    try {
      var saved = JSON.parse(localStorage.getItem(SIZE_KEY) || '{}');
      if (saved.w) maxWIn.value = saved.w;
      if (saved.h) maxHIn.value = saved.h;
    } catch (e) { /* 忽略 */ }
    applyMaxSize();
  }

  maxWIn.addEventListener('input', applyMaxSize);
  maxHIn.addEventListener('input', applyMaxSize);

  window.addEventListener('resize', function () {
    if (!isFloating) return;
    floatWrap.style.width = computeWrapWidth() + 'px';
    clampPosition();
  });

  /* ============ 紧凑模式 ============ */

  function applyCompact(on) {
    grid.classList.toggle('compact', on);
    compactInput.checked = on;
    try { localStorage.setItem(COMPACT_KEY, on ? '1' : '0'); } catch (e) { /* 忽略 */ }
  }

  compactInput.addEventListener('change', function () {
    applyCompact(compactInput.checked);
  });

  function restoreCompact() {
    var on = false;
    try { on = localStorage.getItem(COMPACT_KEY) === '1'; } catch (e) { /* 忽略 */ }
    applyCompact(on);
  }

  /* ============ 默认时长设置 ============ */

  function writeDefaultInputs(sec) {
    defH.value = Math.floor(sec / 3600);
    defM.value = Math.floor((sec % 3600) / 60);
    defS.value = sec % 60;
  }

  function onDefaultInput() {
    var h = clampInt(defH.value, 0, 999);
    var m = clampInt(defM.value, 0, 999);
    var s = clampInt(defS.value, 0, 999);
    defaultSec = h * 3600 + m * 60 + s;
    saveDebounced();
  }

  defH.addEventListener('input', onDefaultInput);
  defM.addEventListener('input', onDefaultInput);
  defS.addEventListener('input', onDefaultInput);
  [defH, defM, defS].forEach(function (inp) {
    inp.addEventListener('focus', function () { inp.select(); });
  });

  /* ============ 本地持久化（仅初始设置 + 顺序） ============ */

  function serializeTimers() {
    var out = [];
    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      out.push({
        name: t.el.name.value,
        durationMs: t.durationMs
      });
    }
    return out;
  }

  function saveTimers() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        timers: serializeTimers(),
        defaultSec: defaultSec
      }));
    } catch (e) { /* 忽略 */ }
  }

  var saveDebounced = debounce(saveTimers, 300);

  /* ============ 主循环 ============ */

  function tick() {
    var now = performance.now();
    var anyRunning = false;

    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      if (!t.running) continue;
      anyRunning = true;
      paint(t, t.endAt - now);
    }

    rafId = anyRunning ? requestAnimationFrame(tick) : null;
  }

  function ensureLoop() {
    if (rafId === null) rafId = requestAnimationFrame(tick);
  }

  /* ============ 单个计时器逻辑 ============ */

  function readInputs(t) {
    var el = t.el;
    var h = clampInt(el.h.value, 0, 999);
    var m = clampInt(el.m.value, 0, 999);
    var s = clampInt(el.s.value, 0, 999);
    return ((h * 3600) + (m * 60) + s) * 1000;
  }

  function writeInputs(t, totalMs) {
    var total = Math.max(0, Math.round(totalMs / 1000));
    t.el.h.value = Math.floor(total / 3600);
    t.el.m.value = Math.floor((total % 3600) / 60);
    t.el.s.value = total % 60;
  }

  function togglePlay(t) {
    var el = t.el;

    if (t.running) {
      t.remainingMs = t.endAt - performance.now();
      t.running = false;
      el.play.classList.remove('running');
      el.play.title = '开始';
      el.card.classList.remove('running');
      paint(t, t.remainingMs);
    } else {
      if (t.durationMs === 0 && t.remainingMs === 0) return;
      t.endAt = performance.now() + t.remainingMs;
      t.running = true;
      el.play.classList.add('running');
      el.play.title = '暂停';
      el.card.classList.add('running');
      ensureLoop();
    }
  }

  function resetTimer(t) {
    t.durationMs = readInputs(t);
    if (t.running) {
      t.endAt = performance.now() + t.durationMs;
      ensureLoop();
    } else {
      t.remainingMs = t.durationMs;
      paint(t, t.remainingMs);
    }
    saveTimers();
  }

  function applyInput(t) {
    t.durationMs = readInputs(t);
    if (t.running) {
      t.endAt = performance.now() + t.durationMs;
      ensureLoop();
    } else {
      t.remainingMs = t.durationMs;
      paint(t, t.remainingMs);
    }
    saveDebounced();
  }

  function removeTimer(t) {
    var i = timers.indexOf(t);
    if (i === -1) return;
    timers.splice(i, 1);
    if (t.el.card.parentNode) t.el.card.parentNode.removeChild(t.el.card);
    updateEmpty();
    saveTimers();
  }

  /* ============ 卡片拖拽排序 ============ */

  var drag = {
    card: null,
    pending: false,
    active: false,
    timer: null,
    startX: 0, startY: 0,
    offsetX: 0, offsetY: 0,
    lastX: 0, lastY: 0,
    pointerId: null,
    placeholder: null,
    justDragged: false
  };

  var LONG_PRESS_MS = 500;
  var MOVE_THRESHOLD = 8;

  function onCardPointerDown(e, t) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('input, button, textarea, select, a, label')) return;
    if (drag.active || drag.pending) return;

    drag.card = t;
    drag.pending = true;
    drag.active = false;
    drag.startX = e.clientX;
    drag.startY = e.clientY;
    drag.lastX = e.clientX;
    drag.lastY = e.clientY;
    drag.pointerId = e.pointerId;

    drag.timer = setTimeout(function () {
      if (drag.pending) activateDrag();
    }, LONG_PRESS_MS);

    document.addEventListener('pointermove', onDocPointerMove);
    document.addEventListener('pointerup', onDocPointerUp);
    document.addEventListener('pointercancel', onDocPointerUp);
  }

  function onDocPointerMove(e) {
    if (e.pointerId !== drag.pointerId) return;

    drag.lastX = e.clientX;
    drag.lastY = e.clientY;

    if (drag.pending) {
      var dx = e.clientX - drag.startX;
      var dy = e.clientY - drag.startY;
      if (Math.sqrt(dx * dx + dy * dy) > MOVE_THRESHOLD) cancelPendingDrag();
      return;
    }

    if (drag.active) {
      if (e.cancelable) e.preventDefault();
      updateDragPosition();
    }
  }

  function onDocPointerUp(e) {
    if (e.pointerId !== drag.pointerId) return;

    if (drag.pending) {
      cancelPendingDrag();
    } else if (drag.active) {
      endDrag();
    }
  }

  function cancelPendingDrag() {
    clearTimeout(drag.timer);
    drag.timer = null;
    drag.pending = false;
    drag.card = null;
    drag.pointerId = null;
    document.removeEventListener('pointermove', onDocPointerMove);
    document.removeEventListener('pointerup', onDocPointerUp);
    document.removeEventListener('pointercancel', onDocPointerUp);
  }

  function activateDrag() {
    if (!drag.card || !drag.pending) return;

    var card = drag.card.el.card;
    var rect = card.getBoundingClientRect();

    drag.offsetX = drag.lastX - rect.left;
    drag.offsetY = drag.lastY - rect.top;

    var ph = document.createElement('div');
    ph.className = 'drag-placeholder';
    ph.style.height = rect.height + 'px';
    card.parentNode.insertBefore(ph, card);
    drag.placeholder = ph;

    card.classList.add('dragging');
    card.style.position = 'fixed';
    card.style.left = rect.left + 'px';
    card.style.top = rect.top + 'px';
    card.style.width = rect.width + 'px';
    card.style.height = rect.height + 'px';
    card.style.margin = '0';
    card.style.zIndex = '1000';

    drag.pending = false;
    drag.active = true;
    drag.justDragged = true;

    document.body.classList.add('dragging-active');
  }

  function updateDragPosition() {
    if (!drag.active) return;

    var card = drag.card.el.card;
    var x = drag.lastX - drag.offsetX;
    var y = drag.lastY - drag.offsetY;

    card.style.left = x + 'px';
    card.style.top = y + 'px';

    var el = document.elementFromPoint(drag.lastX, drag.lastY);
    var targetCard = el ? el.closest('.card') : null;
    if (!targetCard || targetCard === card) return;
    if (!targetCard.classList.contains('card')) return;

    var ph = drag.placeholder;
    if (!ph) return;

    var targetRect = targetCard.getBoundingClientRect();
    var midY = targetRect.top + targetRect.height / 2;
    var shouldInsertBefore = drag.lastY < midY;

    if (shouldInsertBefore) {
      if (ph.nextElementSibling === targetCard) return;
      targetCard.parentNode.insertBefore(ph, targetCard);
    } else {
      if (ph.previousElementSibling === targetCard) return;
      targetCard.parentNode.insertBefore(ph, targetCard.nextElementSibling);
    }
  }

  function endDrag() {
    if (!drag.active) return;

    var card = drag.card.el.card;
    var ph = drag.placeholder;

    card.classList.remove('dragging');
    card.style.position = '';
    card.style.left = '';
    card.style.top = '';
    card.style.width = '';
    card.style.height = '';
    card.style.margin = '';
    card.style.zIndex = '';

    if (ph && ph.parentNode) {
      ph.parentNode.insertBefore(card, ph);
      ph.parentNode.removeChild(ph);
    }

    document.body.classList.remove('dragging-active');

    drag.active = false;
    drag.card = null;
    drag.placeholder = null;
    drag.pointerId = null;

    document.removeEventListener('pointermove', onDocPointerMove);
    document.removeEventListener('pointerup', onDocPointerUp);
    document.removeEventListener('pointercancel', onDocPointerUp);

    reorderTimers();
    saveTimers();

    setTimeout(function () { drag.justDragged = false; }, 0);
  }

  function reorderTimers() {
    var cards = Array.prototype.slice.call(grid.children).filter(function (el) {
      return el.classList && el.classList.contains('card');
    });

    var newTimers = [];
    cards.forEach(function (card) {
      for (var i = 0; i < timers.length; i++) {
        if (timers[i].el.card === card) {
          newTimers.push(timers[i]);
          break;
        }
      }
    });

    timers = newTimers;
  }

  grid.addEventListener('click', function (e) {
    if (drag.justDragged) {
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  document.addEventListener('contextmenu', function (e) {
    if (drag.active || barDrag.active) e.preventDefault();
  });

  /* ============ 创建计时器 ============ */

  function createTimer(initialSec, opts) {
    opts = opts || {};
    seq += 1;

    var node = tpl.content.firstElementChild.cloneNode(true);
    var t = {
      id: seq,
      durationMs: 0,
      remainingMs: 0,
      running: false,
      endAt: 0,
      lastText: null,
      lastState: null,
      el: {}
    };

    var el = t.el;
    el.card    = node;
    el.name    = node.querySelector('.name');
    el.display = node.querySelector('.display');
    el.h       = node.querySelector('.in-h');
    el.m       = node.querySelector('.in-m');
    el.s       = node.querySelector('.in-s');
    el.play    = node.querySelector('.btn-play');
    el.reset   = node.querySelector('.btn-reset');
    el.del     = node.querySelector('.btn-del');
    el.fold    = node.querySelector('.btn-fold');

    el.name.value = (typeof opts.name === 'string' && opts.name.trim())
      ? opts.name
      : ('计时器 ' + seq);

    t.durationMs = (typeof opts.durationMs === 'number')
      ? opts.durationMs
      : initialSec * 1000;

    t.remainingMs = t.durationMs;

    writeInputs(t, t.durationMs);

    el.name.addEventListener('focus', function () { el.name.select(); });
    el.name.addEventListener('input', saveDebounced);

    [el.h, el.m, el.s].forEach(function (inp) {
      inp.addEventListener('input', function () { applyInput(t); });
      inp.addEventListener('focus', function () { inp.select(); });
    });

    el.fold.addEventListener('click', function () {
      var expanded = el.card.classList.toggle('expanded');
      el.fold.title = expanded ? '收起时间设置' : '展开时间设置';
    });

    el.play.addEventListener('click', function () { togglePlay(t); });
    el.reset.addEventListener('click', function () { resetTimer(t); });
    el.del.addEventListener('click', function () { removeTimer(t); });

    el.card.addEventListener('pointerdown', function (e) {
      onCardPointerDown(e, t);
    });

    return t;
  }

  function addTimer() {
    var t = createTimer(defaultSec, { name: computeNextTimerName() });
    timers.push(t);
    grid.appendChild(t.el.card);
    paint(t, t.remainingMs);
    updateEmpty();
    saveTimers();
  }

  /* ============ 从本地恢复（仅初始设置） ============ */

  function restoreState() {
    var data = null;
    try { data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { data = null; }

    if (!data || !Array.isArray(data.timers)) {
      addTimer();
      return;
    }

    if (typeof data.defaultSec === 'number' && data.defaultSec >= 0) {
      defaultSec = data.defaultSec;
      writeDefaultInputs(defaultSec);
    }

    if (data.timers.length === 0) {
      updateEmpty();
      return;
    }

    data.timers.forEach(function (item) {
      var t = createTimer(0, {
        name: item.name,
        durationMs: (typeof item.durationMs === 'number') ? item.durationMs : 0
      });
      timers.push(t);
      grid.appendChild(t.el.card);
      paint(t, t.remainingMs);
    });

    updateEmpty();
  }

  window.addEventListener('pagehide', saveTimers);

  /* ============ 初始化 ============ */

  addBtn.addEventListener('click', addTimer);

  restoreCompact();
  restoreState();
  restoreMaxSize();

})();
</script>
</body>
</html>
