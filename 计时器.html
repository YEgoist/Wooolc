<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>倒计时</title>
<style>
  :root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#111827;
    --muted:#9aa3b2;
    --border:#e6e9f0;
    --accent:#3b82f6;
    --accent-soft:#eaf1ff;
    --danger:#ef4444;
    --warn:#f59e0b;
    --radius:16px;
    --shadow:0 1px 2px rgba(17,24,39,.05), 0 6px 20px rgba(17,24,39,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117;
      --card:#161b22;
      --text:#e6edf3;
      --muted:#6e7781;
      --border:#232a35;
      --accent:#4f8cff;
      --accent-soft:#1b2637;
      --danger:#ff6b6b;
      --warn:#ffb020;
      --shadow:none;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;overflow-x:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .2s, color .2s;
  }

  .app{
    max-width:1200px;
    margin:0 auto;
    padding:24px 20px 80px;
  }

  /* ---------- 顶部工具栏 ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  .toolbar-left{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }

  /* 尺寸设置面板：默认隐藏 */
  .size-panel{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 12px;
    box-shadow:var(--shadow);
    transition:opacity .15s;
  }
  .size-panel.hidden{display:none}
  .size-field{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    color:var(--muted);
    user-select:none;
  }
  .size-field input{
    width:66px;height:32px;
    border:1px solid var(--border);
    border-radius:10px;
    background:transparent;
    color:var(--text);
    text-align:center;
    font-size:13px;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    padding:0 4px;
    -moz-appearance:textfield;
    transition:border-color .15s, background .15s;
  }
  .size-field input::-webkit-outer-spin-button,
  .size-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .size-field input:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}
  .size-field input::placeholder{color:var(--muted);opacity:.65;font-size:12px}

  .add-btn{
    display:inline-flex;align-items:center;gap:6px;
    height:40px;padding:0 18px;border-radius:20px;
    border:none;background:var(--accent);color:#fff;
    font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(59,130,246,.28);
    transition:transform .08s, background .2s, box-shadow .2s;
  }
  .add-btn:hover{background:#2f6fe0}
  .add-btn:active{transform:scale(.96)}
  .add-btn svg{width:18px;height:18px;fill:currentColor}

  /* 尺寸切换按钮 */
  .size-toggle{
    width:40px;height:40px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    display:grid;place-items:center;
    padding:0;cursor:pointer;
    transition:background .15s, border-color .15s, color .15s, transform .06s;
  }
  .size-toggle:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .size-toggle:active{transform:scale(.93)}
  .size-toggle.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .size-toggle svg{width:18px;height:18px;fill:currentColor}

  /* ---------- 网格（可限宽限高 + 滚动） ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(300px, 100%), 1fr));
    gap:16px;
    align-items:start;
    margin:0 auto;
    overflow:auto;
    scrollbar-gutter:stable;
    scrollbar-width:thin;
    scrollbar-color:var(--border) transparent;
  }
  .grid::-webkit-scrollbar{width:8px;height:8px}
  .grid::-webkit-scrollbar-track{background:transparent}
  .grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .grid::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px 14px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:4px;
    transition:background .2s, border-color .2s;
  }

  .card-head{display:flex;align-items:center;gap:6px}

  .name{
    flex:1;min-width:0;
    border:none;background:transparent;
    color:var(--text);
    font-size:14px;font-weight:600;font-family:inherit;
    padding:5px 6px;
    border-radius:8px;
    text-overflow:ellipsis;
  }
  .name::placeholder{color:var(--muted);font-weight:400}
  .name:focus{outline:none;background:var(--accent-soft)}

  /* ---------- 时间显示 ---------- */
  .display{
    font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size:2.25rem;
    font-weight:600;
    line-height:1.15;
    letter-spacing:.5px;
    text-align:center;
    padding:8px 0 12px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    color:var(--text);
    transition:color .2s;
  }
  .display.warn{color:var(--warn)}
  .display.neg{color:var(--danger)}

  /* ---------- 底部：设置 + 操作 ---------- */
  .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }

  /* 时间设置区：始终占位，运行中仅悬停可见 */
  .setters{
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
    min-height:32px;
    border-radius:10px;
    transition:background .15s;
  }
  .card.running .setters:hover{background:var(--accent-soft)}

  .field{
    display:flex;
    align-items:center;
    gap:2px;
    transition:opacity .15s ease;
  }
  .card.running .setters .field{opacity:0;visibility:hidden}
  .card.running .setters:hover .field{opacity:1;visibility:visible}

  .field input{
    width:36px;height:32px;
    border:1px solid var(--border);
    border-radius:8px;
    background:transparent;
    color:var(--text);
    text-align:center;
    font-size:14px;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
    padding:0;
    -moz-appearance:textfield;
    transition:border-color .15s, background .15s;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .field input:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}

  .unit{font-size:11px;color:var(--muted);user-select:none}

  .actions{display:flex;gap:6px}

  .icon-btn{
    width:34px;height:34px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    display:grid;place-items:center;
    padding:0;cursor:pointer;
    transition:background .15s, border-color .15s, color .15s, transform .06s;
  }
  .icon-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .icon-btn:active{transform:scale(.93)}
  .icon-btn svg{width:16px;height:16px;fill:currentColor}

  .btn-del{width:28px;height:28px;border-color:transparent;color:var(--muted)}
  .btn-del:hover{color:var(--danger);border-color:var(--danger);background:transparent}

  .btn-play .i-pause{display:none}
  .btn-play.running .i-play{display:none}
  .btn-play.running .i-pause{display:block}
  .btn-play.running{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  /* 触屏等无悬停能力的设备：始终显示，避免无法操作 */
  @media (hover:none){
    .card.running .setters .field{opacity:1;visibility:visible}
    .card.running .setters:hover{background:transparent}
  }

  /* ---------- 空状态 ---------- */
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:70px 0;
    user-select:none;
  }

  /* ---------- 小屏适配 ---------- */
  @media (max-width:560px){
    .toolbar{justify-content:center}
    .toolbar-left{justify-content:center;width:100%}
    .add-btn{width:100%;justify-content:center}
  }
  @media (max-width:480px){
    .app{padding:16px 12px 60px}
    .toolbar{margin-bottom:14px}
    .display{font-size:1.95rem;padding:6px 0 10px}
  }
</style>
</head>
<body>

<div class="app">
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="sizeToggle" class="size-toggle" title="容器尺寸设置" aria-label="容器尺寸设置">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>

      <div id="sizePanel" class="size-panel hidden">
        <label class="size-field">
          <span>宽</span>
          <input id="maxW" type="number" inputmode="numeric" min="0" max="4000" placeholder="不限" aria-label="容器最大宽度">
          <span>px</span>
        </label>
        <label class="size-field">
          <span>高</span>
          <input id="maxH" type="number" inputmode="numeric" min="0" max="4000" placeholder="不限" aria-label="容器最大高度">
          <span>px</span>
        </label>
      </div>
    </div>

    <button id="addBtn" class="add-btn" title="添加计时器">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      <span>添加</span>
    </button>
  </div>

  <main id="grid" class="grid"></main>
  <div id="empty" class="empty">点「添加」创建计时器</div>
</div>

<!-- 计时器卡片模板 -->
<template id="tpl">
  <section class="card">
    <div class="card-head">
      <input class="name" type="text" maxlength="30" placeholder="名称" aria-label="计时器名称">
      <button class="icon-btn btn-del" title="删除" aria-label="删除">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <div class="display">00:00:00</div>

    <div class="card-foot">
      <div class="setters">
        <span class="field">
          <input class="in-h" type="number" inputmode="numeric" min="0" max="999" placeholder="00" aria-label="小时">
          <span class="unit">时</span>
        </span>
        <span class="field">
          <input class="in-m" type="number" inputmode="numeric" min="0" max="999" placeholder="00" aria-label="分钟">
          <span class="unit">分</span>
        </span>
        <span class="field">
          <input class="in-s" type="number" inputmode="numeric" min="0" max="999" placeholder="00" aria-label="秒">
          <span class="unit">秒</span>
        </span>
      </div>

      <div class="actions">
        <button class="icon-btn btn-play" title="开始" aria-label="开始或暂停">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="icon-btn btn-reset" title="重置" aria-label="重置">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </div>
  </section>
</template>

<script>
(function () {
  'use strict';

  var grid     = document.getElementById('grid');
  var emptyEl  = document.getElementById('empty');
  var tpl      = document.getElementById('tpl');
  var addBtn   = document.getElementById('addBtn');
  var maxWIn   = document.getElementById('maxW');
  var maxHIn   = document.getElementById('maxH');
  var sizeToggle = document.getElementById('sizeToggle');
  var sizePanel  = document.getElementById('sizePanel');

  var timers = [];
  var rafId  = null;
  var seq    = 0;

  var DEFAULT_SEC = 20*60;
  var SIZE_KEY = 'countdown-container-size';

  /* ============ 尺寸面板显隐 ============ */

  function toggleSizePanel() {
    var hidden = sizePanel.classList.toggle('hidden');
    sizeToggle.classList.toggle('active', !hidden);
  }

  sizeToggle.addEventListener('click', toggleSizePanel);

  /* ============ 容器尺寸控制 ============ */

  function applyMaxSize() {
    var w = parseFloat(maxWIn.value);
    var h = parseFloat(maxHIn.value);

    grid.style.maxWidth  = (w > 0) ? w + 'px' : '';
    grid.style.maxHeight = (h > 0) ? h + 'px' : '';

    try {
      localStorage.setItem(SIZE_KEY, JSON.stringify({
        w: w > 0 ? w : '',
        h: h > 0 ? h : ''
      }));
    } catch (e) { /* 忽略 */ }
  }

  function restoreMaxSize() {
    try {
      var saved = JSON.parse(localStorage.getItem(SIZE_KEY) || '{}');
      if (saved.w) maxWIn.value = saved.w;
      if (saved.h) maxHIn.value = saved.h;
    } catch (e) { /* 忽略 */ }
    applyMaxSize();
  }

  maxWIn.addEventListener('input', applyMaxSize);
  maxHIn.addEventListener('input', applyMaxSize);

  /* ============ 工具函数 ============ */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fmt(ms) {
    var neg = ms < 0;
    var total = Math.ceil(Math.abs(ms) / 1000);
    return (neg ? '-' : '') +
      pad(Math.floor(total / 3600)) + ':' +
      pad(Math.floor((total % 3600) / 60)) + ':' +
      pad(total % 60);
  }

  function paint(t, ms) {
    var el = t.el;
    var text = fmt(ms);
    if (text !== t.lastText) {
      el.display.textContent = text;
      t.lastText = text;
    }
    var state = ms < 0 ? 'neg' : (ms > 0 && ms <= 10000 ? 'warn' : '');
    if (state !== t.lastState) {
      el.display.classList.toggle('neg', state === 'neg');
      el.display.classList.toggle('warn', state === 'warn');
      t.lastState = state;
    }
  }

  function updateEmpty() {
    emptyEl.style.display = timers.length ? 'none' : '';
  }

  /* ============ 主循环 ============ */

  function tick() {
    var now = performance.now();
    var anyRunning = false;

    for (var i = 0; i < timers.length; i++) {
      var t = timers[i];
      if (!t.running) continue;
      anyRunning = true;
      paint(t, t.endAt - now);
    }

    rafId = anyRunning ? requestAnimationFrame(tick) : null;
  }

  function ensureLoop() {
    if (rafId === null) rafId = requestAnimationFrame(tick);
  }

  /* ============ 单个计时器逻辑 ============ */

  function readInputs(t) {
    var el = t.el;
    var h = Math.max(0, Math.min(999, parseInt(el.h.value, 10) || 0));
    var m = Math.max(0, Math.min(999, parseInt(el.m.value, 10) || 0));
    var s = Math.max(0, Math.min(999, parseInt(el.s.value, 10) || 0));
    return ((h * 3600) + (m * 60) + s) * 1000;
  }

  function writeInputs(t, totalMs) {
    var total = Math.round(totalMs / 1000);
    t.el.h.value = Math.floor(total / 3600);
    t.el.m.value = Math.floor((total % 3600) / 60);
    t.el.s.value = total % 60;
  }

  function togglePlay(t) {
    var el = t.el;

    if (t.running) {
      t.remainingMs = t.endAt - performance.now();
      t.running = false;
      el.play.classList.remove('running');
      el.play.title = '开始';
      el.card.classList.remove('running');
      paint(t, t.remainingMs);
    } else {
      if (t.durationMs === 0 && t.remainingMs === 0) return;
      t.endAt = performance.now() + t.remainingMs;
      t.running = true;
      el.play.classList.add('running');
      el.play.title = '暂停';
      el.card.classList.add('running');
      ensureLoop();
    }
  }

  function resetTimer(t) {
    t.durationMs = readInputs(t);

    if (t.running) {
      t.endAt = performance.now() + t.durationMs;
      ensureLoop();
    } else {
      t.remainingMs = t.durationMs;
      paint(t, t.remainingMs);
    }
  }

  function applyInput(t) {
    t.durationMs = readInputs(t);

    if (t.running) {
      t.endAt = performance.now() + t.durationMs;
      ensureLoop();
    } else {
      t.remainingMs = t.durationMs;
      paint(t, t.remainingMs);
    }
  }

  function removeTimer(t) {
    var i = timers.indexOf(t);
    if (i === -1) return;
    timers.splice(i, 1);
    if (t.el.card.parentNode) t.el.card.parentNode.removeChild(t.el.card);
    updateEmpty();
  }

  /* ============ 创建计时器 ============ */

  function createTimer(initialSec) {
    seq += 1;

    var node = tpl.content.firstElementChild.cloneNode(true);
    var t = {
      id: seq,
      durationMs: 0,
      remainingMs: 0,
      running: false,
      endAt: 0,
      lastText: null,
      lastState: null,
      el: {}
    };

    var el = t.el;
    el.card    = node;
    el.name    = node.querySelector('.name');
    el.display = node.querySelector('.display');
    el.h       = node.querySelector('.in-h');
    el.m       = node.querySelector('.in-m');
    el.s       = node.querySelector('.in-s');
    el.play    = node.querySelector('.btn-play');
    el.reset   = node.querySelector('.btn-reset');
    el.del     = node.querySelector('.btn-del');

    el.name.value = '计时器 ' + seq;
    t.durationMs = initialSec * 1000;
    t.remainingMs = t.durationMs;
    writeInputs(t, t.durationMs);

    el.name.addEventListener('focus', function () { el.name.select(); });

    [el.h, el.m, el.s].forEach(function (inp) {
      inp.addEventListener('input', function () { applyInput(t); });
      inp.addEventListener('focus', function () { inp.select(); });
    });

    el.play.addEventListener('click', function () { togglePlay(t); });
    el.reset.addEventListener('click', function () { resetTimer(t); });
    el.del.addEventListener('click', function () { removeTimer(t); });

    return t;
  }

  function addTimer() {
    var t = createTimer(DEFAULT_SEC);
    timers.push(t);
    grid.appendChild(t.el.card);
    paint(t, t.remainingMs);
    updateEmpty();
  }

  /* ============ 初始化 ============ */

  addBtn.addEventListener('click', addTimer);

  restoreMaxSize();
  addTimer();
  updateEmpty();

})();
</script>
</body>
</html>
